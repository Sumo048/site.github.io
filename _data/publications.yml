- title: "Curvature Informed Furthest Point Sampling"
  authors: "Shubham Bhardwaj, <b>Soumojit Bhattacharya*</b>, Ashwin Vinod*, Aryan Koganti, Aditya Sai Ellendula, Balakrishna Reddy"
