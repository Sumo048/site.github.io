# Papers, newest first. `highlight: true` cards get a highlighted border.
# Authors: wrap your own name in <b></b>.

- title: "CS-Pi: Constraint-Satisfying Flow Policy Sampling"
  authors: "<b>Soumojit Bhattacharya</b>, Oliver Kroemer, Shubham Tulsiani"
  venue: "CoRL 2026"
  year: 2026
  image: images/cspi.jpg
  highlight: true
  tldr: "Make a frozen flow policy obey hard constraints at test time. Draw an action, project it onto the safe set, then renoise it by however far it had to move and let the policy denoise again. No retraining, no proxy version of the constraint, and the final action stays on-policy for the pretrained model. 55% safe-success on a real Franka, vs 40% for projection."
  links:
    - { name: "project page", url: "https://sumo048.github.io/CS-pi_site/" }
    - { name: "paper", url: "https://openreview.net/forum?id=2NBZAh51If" }
    - { name: "code", url: "https://github.com/Sumo048/CS-Pi" }

- title: "BEACON: Belief-Enabled Adaptive CONtrol for Imitation Learning under Uncertainty"
  authors: "Moonyoung Lee, <b>Soumojit Bhattacharya</b>, George Kantor, Oliver Kroemer"
  venue: "arXiv 2026"
  year: 2026
  image: images/beacon.png
  tldr: "When the robot can't see the thing that matters, give the diffusion policy a Bayesian belief over the hidden state instead of raw history. Tested on tactile cornstalk gripper alignment and opening a latched door; the belief-conditioned policy beats observation-only and gets close to a privileged policy."
  links:
    - { name: "arXiv", url: "https://arxiv.org/abs/2609.22730" }

